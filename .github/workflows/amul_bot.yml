name: Amul 24/7 Cloud Stock Monitor

on:
  schedule:
    # Starts a fresh cloud session every hour, 24/7
    - cron: '0 * * * *'
  workflow_dispatch: # Lets you click a button to start it manually

concurrency:
  group: amul-stock-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright and Requests
        run: |
          pip install playwright requests
          python -m playwright install --with-deps chromium

      - name: Run Amul Stock Bot
        run: python main.py
